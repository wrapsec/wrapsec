[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "wrapsec-python"
version     = "0.1.0"
description = "WrapSec Python SDK and CLI — AI Security Gateway client"
readme      = "README.md"
requires-python = ">=3.10"
license     = { text = "MIT" }

dependencies = [
    "click>=8.1",
    "requests>=2.31",
    "httpx>=0.27",
]

[project.scripts]
wrapsec = "wrapsec.cli:cli"

[project.urls]
Homepage   = "https://github.com/kbajish/wrapsec"
Repository = "https://github.com/kbajish/wrapsec"

[tool.hatch.build.targets.wheel]
packages = ["wrapsec"]
