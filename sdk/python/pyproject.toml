[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "wrapsec-python"
version     = "1.0.0"
description = "WrapSec Python SDK and CLI — AI Security Gateway client"
readme      = "README.md"
requires-python = ">=3.10"
license     = { text = "MIT" }
authors     = [{ name = "WrapSec", email = "hello@wrapsec.com" }]

dependencies = [
    "requests>=2.31,<3.0",
    "httpx>=0.27,<1.0",
    "click>=8.1",
]

[project.scripts]
wrapsec = "wrapsec.cli:cli"

[project.urls]
Homepage   = "https://wrapsec.com"
Repository = "https://github.com/wrapsec/wrapsec"
Changelog  = "https://github.com/wrapsec/wrapsec/blob/main/sdk/python/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["wrapsec"]
