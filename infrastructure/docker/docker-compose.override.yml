# Dev-only override: runs a local SMTP catcher and points the API at it, so
# account/security notification emails can be inspected without a real mail
# server. NOT used by production (docker-compose.prod.yml) or by the plain
# `./setup.sh` flow (both pass -f explicitly, which disables override
# auto-discovery). Enable it by running compose with BOTH files:
#
#   docker compose -f infrastructure/docker/docker-compose.yml \
#                  -f infrastructure/docker/docker-compose.override.yml up -d
#
# Web UI:        http://localhost:8025
# SMTP endpoint: mail-sink:1025 (internal to the compose network, no auth, plaintext)

services:
  mail-sink:
    # A specific catcher image supplies the mechanism; the service is generic.
    image: axllent/mailpit:latest
    container_name: wrapsec_mail_sink
    ports:
      - "8025:8025"   # web UI (SMTP 1025 stays internal to the network)
    restart: unless-stopped

  api:
    # Route notification email through the local SMTP catcher. Plaintext, no
    # auth -- correct for a local sink (both TLS flags false is the local/test
    # case the settings validator explicitly allows).
    environment:
      - SMTP_HOST=mail-sink
      - SMTP_PORT=1025
      - SMTP_USE_TLS=false
      - SMTP_START_TLS=false
      - SMTP_FROM=no-reply@wrapsec.local
      - SMTP_FROM_NAME=WrapSec
