services:

  nginx:
    image: nginx:alpine
    container_name: wrapsec_nginx
    # SSL mode: uses envsubst template with NGINX_HOST, SSL_CERT_PATH, SSL_KEY_PATH
    # HTTP mode: uses nginx.http.conf directly
    # setup.sh selects the correct config via NGINX_CONF env var
    volumes:
      - ${NGINX_CONF}:/etc/nginx/nginx.conf:ro
      - ${SSL_CERT_PATH:-/dev/null}:/etc/ssl/wrapsec/cert.pem:ro
      - ${SSL_KEY_PATH:-/dev/null}:/etc/ssl/wrapsec/key.pem:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        BUILD_ENV: prod
    container_name: wrapsec_api
    env_file:
      - ../../.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://wrapsec:${POSTGRES_PASSWORD}@postgres:5432/wrapsec
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.dashboard
      args:
        # Required. next.config.ts (M4 guard) fails the production build if
        # this is unset. Operators must set NEXT_PUBLIC_API_URL in .env to
        # the public URL of the deployment (e.g. https://api.example.com).
        # BFF pattern means this value rarely reaches the browser, but it
        # is still inlined into the client bundle at build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set in .env for prod builds}
    container_name: wrapsec_dashboard
    environment:
      - API_URL=http://api:8000
      - COOKIE_SECURE=true
      # DASHBOARD_ORIGIN must match one of the api's CORS_ALLOWED_ORIGINS
      # (see .env). Enables the M5 X-Refresh-Cookie-Path handshake so the
      # backend emits Path=/api/auth for the dashboard's refresh cookie.
      - DASHBOARD_ORIGIN=${DASHBOARD_ORIGIN}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: wrapsec_postgres
    environment:
      POSTGRES_USER:     wrapsec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       wrapsec
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    # No host port mapping in production — only accessible within Docker network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wrapsec"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wrapsec_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    # No host port mapping in production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: wrapsec_prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Bearer token for the authenticated /metrics scrape. Written by
      # scripts/write_metrics_token.sh; gitignored, never committed.
      - ../prometheus/metrics_token:/etc/prometheus/metrics_token:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    restart: unless-stopped

  # OpenTelemetry Collector: bridges /metrics to any OTLP-compatible
  # backend without re-instrumenting the application. Opt-in via profile
  # so a production `docker compose -f docker-compose.prod.yml up -d` is
  # byte-for-byte unchanged until an operator elects to enable OTLP
  # export with `--profile otlp`.
  # Config: infrastructure/otel-collector/otel-collector-config.yaml
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    container_name: wrapsec_otel_collector
    profiles: ["otlp"]
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      - METRICS_AUTH_TOKEN=${METRICS_TOKEN:-${ADMIN_API_KEY}}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      - OTEL_EXPORTER_OTLP_INSECURE=${OTEL_EXPORTER_OTLP_INSECURE:-false}
    volumes:
      - ../otel-collector/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: wrapsec_grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      # Fail closed if GRAFANA_PASSWORD is unset/empty. Grafana otherwise
      # falls back to the default admin/admin credentials, which are indexed
      # by every shodan-style scanner. The setup.sh --prod path additionally
      # rejects known-weak values (admin, changeme, ...) before this point.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set to a strong non-default value (>=12 chars, not admin/changeme/etc.). Run ./setup.sh --prod for a validated bootstrap.}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ../grafana/dashboards.yml:/etc/grafana/provisioning/dashboards.yml:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
