services:

  nginx:
    image: nginx:alpine
    container_name: wrapsec_nginx
    # SSL mode: uses envsubst template with NGINX_HOST, SSL_CERT_PATH, SSL_KEY_PATH
    # HTTP mode: uses nginx.http.conf directly
    # setup.sh selects the correct config via NGINX_CONF env var
    volumes:
      - ${NGINX_CONF}:/etc/nginx/nginx.conf:ro
      - ${SSL_CERT_PATH:-/dev/null}:/etc/ssl/wrapsec/cert.pem:ro
      - ${SSL_KEY_PATH:-/dev/null}:/etc/ssl/wrapsec/key.pem:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        BUILD_ENV: prod
    container_name: wrapsec_api
    env_file:
      - ../../.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://wrapsec:${POSTGRES_PASSWORD}@postgres:5432/wrapsec
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.dashboard
      args:
        NEXT_PUBLIC_API_URL: ""
    container_name: wrapsec_dashboard
    environment:
      - API_URL=http://api:8000
      - COOKIE_SECURE=true
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: wrapsec_postgres
    environment:
      POSTGRES_USER:     wrapsec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       wrapsec
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    # No host port mapping in production — only accessible within Docker network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wrapsec"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wrapsec_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    # No host port mapping in production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: wrapsec_prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: wrapsec_grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ../grafana/dashboards.yml:/etc/grafana/provisioning/dashboards.yml:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
