services:

  nginx:
    image: nginx:alpine
    container_name: wrapsec_nginx
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        BUILD_ENV: dev
    container_name: wrapsec_api
    env_file:
      - ../../.env
    environment:
      # Dev posture is explicit: an unset ENVIRONMENT now defaults to production
      # (safe), which the COOKIE_SECURE guard would reject over local http.
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://wrapsec:wrapsec@postgres:5432/wrapsec
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # healthcheck lives in the Dockerfile so the image is self-describing

  dashboard:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.dashboard
      args:
        # BFF pattern: the browser only talks to the dashboard's own /api/*
        # routes (CSP connect-src 'self'), so this value is essentially
        # unused client-side. It must still be set to satisfy the M4 guard
        # in next.config.ts. In dev, http://localhost points at the nginx
        # container which reverse-proxies to the api.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost}
    container_name: wrapsec_dashboard
    environment:
      - API_URL=http://api:8000
      - COOKIE_SECURE=false
      # DASHBOARD_ORIGIN is the Origin header the BFF sends to the backend
      # so the backend recognises it as trusted and honors the BFF's
      # X-Refresh-Cookie-Path handshake. Must match one of the values in
      # the api's CORS_ALLOWED_ORIGINS (.env). Leave empty in local http dev
      # only when the backend also has REFRESH_COOKIE_PATH=/api/auth set,
      # otherwise the browser will store the cookie at /v1/auth and the
      # dashboard refresh flow won't find it.
      - DASHBOARD_ORIGIN=${DASHBOARD_ORIGIN:-}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: wrapsec_postgres
    environment:
      POSTGRES_USER:     wrapsec
      POSTGRES_PASSWORD: wrapsec
      POSTGRES_DB:       wrapsec
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wrapsec"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wrapsec_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: wrapsec_prometheus
    ports:
      # Bind to localhost only — Prometheus must never be public-facing.
      # Access via SSH tunnel: ssh -L 9090:localhost:9090 user@host
      - "127.0.0.1:9090:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    restart: unless-stopped

  # OpenTelemetry Collector: bridges the existing Prometheus /metrics
  # endpoint to any OTLP-compatible backend without re-instrumenting the
  # app. Opt-in via profile so existing `docker compose up` deployments
  # are unchanged:
  #   docker compose --profile otlp up -d
  # Config: infrastructure/otel-collector/otel-collector-config.yaml
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: wrapsec_otel_collector
    profiles: ["otlp"]
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      # /metrics is Bearer-protected. Reuse METRICS_TOKEN if set, else the
      # admin key. Do not weaken /metrics auth just for the collector.
      - METRICS_AUTH_TOKEN=${METRICS_TOKEN:-${ADMIN_API_KEY}}
      # OTLP destination -- set these to enable real export. Names follow
      # the OpenTelemetry Protocol Exporter spec.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4317}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      - OTEL_EXPORTER_OTLP_INSECURE=${OTEL_EXPORTER_OTLP_INSECURE:-true}
    volumes:
      - ../otel-collector/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: wrapsec_grafana
    ports:
      # Bind to localhost only — serve Grafana behind nginx with auth in production.
      # IMPORTANT: Change GF_SECURITY_ADMIN_PASSWORD before deployment.
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=changeme_before_deploy  # CHANGE THIS before production deployment
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ../grafana/dashboards.yml:/etc/grafana/provisioning/dashboards.yml:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data: