# WrapSec Alembic configuration.
# Migration scripts live in db/migrations/versions/. env.py sets the
# database URL dynamically from config.settings.get_settings() so a
# separate sqlalchemy.url here is intentionally omitted.

[alembic]
script_location    = db/migrations
prepend_sys_path   = .
version_path_separator = os
file_template      = %%(rev)s_%%(slug)s

# Logging follows the app's default INFO level. Keep alembic quiet in
# production; verbose output belongs in application logs.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level    = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level    = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level    = INFO
handlers =
qualname = alembic

[handler_console]
class     = StreamHandler
args      = (sys.stderr,)
level     = NOTSET
formatter = generic

[formatter_generic]
format      = %(levelname)-5.5s [%(name)s] %(message)s
datefmt     = %H:%M:%S
