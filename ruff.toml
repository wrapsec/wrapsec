# Ruff configuration.
#
# No select/extend-select is set, so the default rule set stays in effect;
# this file only tunes it. Line length matches the formatter default (88).

line-length = 88

[lint]
# Rules disabled project-wide, with rationale:
#
# B008 (function-call-in-default-argument): FastAPI expresses dependency
#   injection as call defaults -- Depends(), Query(), Header(), Path(),
#   Security(). That is the framework's intended idiom, not a defect.
#
# BLE001 (blind-except) / S110 (try-except-pass): WrapSec is a fail-closed
#   security gateway, and broad `except Exception` is a deliberate, audited
#   pattern here. Security paths fail closed (deny on error); the detection
#   pipeline degrades gracefully to a clean result; and best-effort work
#   (Redis rate limiting, cache, metrics, audit-event writes) fails open so it
#   never breaks a request. Every silent swallow carries an explanatory
#   comment. Narrowing these handlers would let an unexpected exception escape
#   a worker or auth path -- the opposite of the fail-safe intent.
ignore = ["B008", "BLE001", "S110"]

[lint.per-file-ignores]
# Load/monitoring tooling and the grafana guard test shell out to fixed,
# trusted commands (docker, psql, pip, bash); the default check=False is
# intentional (return codes are handled inline), so the explicit-check rule
# is noise here.
"tests/load/monitor.py" = ["PLW1510"]
"tests/integration/test_grafana_password_guard.py" = ["PLW1510"]
# locust runs its files via `-f` and never imports them as modules, so the
# hyphenated filename is the framework convention, not an invalid module name.
"tests/load/locustfile-b.py" = ["N999"]
# The SDK validation layer and the localization loader raise ValueError
# uniformly for every invalid input -- a single documented exception type for
# callers to catch. TypeError (TRY004) would fragment that contract.
"sdk/python/wrapsec/core/validation.py" = ["TRY004"]
"services/localization.py" = ["TRY004"]
