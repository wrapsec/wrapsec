[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests sdk/python/tests
norecursedirs = tests/manual tests/load tests/eval .venv node_modules .hypothesis
filterwarnings =
    ignore::DeprecationWarning
markers =
    pg: test requires PostgreSQL (skipped when neither WRAPSEC_TEST_PG_URL is
        set nor testcontainers+docker are available). Use for tests that
        exercise PG-only features (jsonb, percentile_cont, triggers, asyncpg
        tz binds) that SQLite cannot cover.
