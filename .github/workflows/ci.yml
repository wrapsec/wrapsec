name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede in-flight runs for the same ref (a new push cancels the old run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the checks only need to read the repo.
permissions:
  contents: read

jobs:
  # ── Backend: static gates (no services, fast) ───────────────────────────────
  backend-static:
    name: backend-static (ruff / pyright / semgrep)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install deps + linters
        # pyright is pinned in requirements-dev; ruff + semgrep are pinned here,
        # CI-only. Semgrep is intentionally NOT a project dev dep -- it does not
        # install cleanly on Windows, where it is run via the semgrep/semgrep
        # Docker image instead. Keep these in lockstep with the versions validated
        # locally (ruff `ruff --version`, semgrep the semgrep/semgrep image tag).
        run: |
          pip install -r requirements-dev.txt
          pip install ruff==0.16.2 semgrep==1.172.0
      - name: Lint (ruff)
        run: make lint
      - name: Types (pyright)
        run: make typecheck
      - name: SAST (semgrep)
        run: make semgrep

  # ── Backend: unit + integration + coverage floor ────────────────────────────
  backend-tests:
    name: backend-tests (unit + integration + coverage)
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wrapsec_test
          POSTGRES_USER: wrapsec
          POSTGRES_PASSWORD: wrapsec
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wrapsec"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TESTING: "true"
      PYTHONPATH: ${{ github.workspace }}
      # Must be development|staging|production (validated); test mode is signalled
      # by TESTING=true, not by ENVIRONMENT.
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://wrapsec:wrapsec@localhost:5432/wrapsec_test
      WRAPSEC_TEST_PG_URL: postgresql+asyncpg://wrapsec:wrapsec@localhost:5432/wrapsec_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci_secret_key_for_testing_minimum_32_characters_long
      ADMIN_API_KEY: ci_admin_api_key_for_testing_minimum_32_chars_x
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci_admin_password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Unit + integration with coverage
        # Uses the postgres/redis service containers directly (WRAPSEC_TEST_PG_URL
        # set), so the integration tier hits real PG without spawning a container.
        # `coverage report` enforces fail_under from .coveragerc.
        run: |
          coverage run -m pytest tests/unit tests/integration -q
          coverage report

  # ── Detection quality: red-team regression gate (offline) ───────────────────
  detection-eval:
    name: detection-eval (red-team gate)
    runs-on: ubuntu-22.04
    env:
      TESTING: "true"
      PYTHONPATH: ${{ github.workspace }}
      ENVIRONMENT: development
      # The eval is offline (FAST/SCAN_ONLY, no DB/Redis), but Settings still
      # requires these fields to construct -- provided as config only, never
      # connected.
      SECRET_KEY: ci_secret_key_for_testing_minimum_32_characters_long
      ADMIN_API_KEY: ci_admin_api_key_for_testing_minimum_32_chars_x
      DATABASE_URL: postgresql+asyncpg://wrapsec:wrapsec@localhost:5432/wrapsec_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Evaluate + gate
        run: make eval

  # ── Frontend: static quality ────────────────────────────────────────────────
  frontend-static:
    name: frontend-static (eslint / tsc / build)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Build
        run: npm run build

  # ── Frontend: unit / component ──────────────────────────────────────────────
  frontend-unit:
    name: frontend-unit (vitest + coverage)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Unit + component (ratcheting coverage floor)
        run: npm run test:coverage

  # ── Frontend: end-to-end + accessibility (real stack) ───────────────────────
  # Gated behind the cheap frontend checks so a broken PR does not spin up a stack.
  frontend-e2e:
    name: frontend-e2e (playwright + axe)
    runs-on: ubuntu-22.04
    needs: [frontend-static, frontend-unit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Create CI env for the stack
        # The compose api service loads root .env via env_file; provide dev-mode
        # defaults plus CI-safe secrets (>= 32 chars).
        run: |
          cp .env.example .env
          sed -i 's#^SECRET_KEY=.*#SECRET_KEY=ci_secret_key_for_testing_minimum_32_characters_long#' .env
          sed -i 's#^ADMIN_API_KEY=.*#ADMIN_API_KEY=ci_admin_api_key_for_testing_minimum_32_chars_x#' .env

      - name: Start the stack (postgres, redis, api, dashboard)
        run: docker compose -f infrastructure/docker/docker-compose.yml up -d --build postgres redis api dashboard

      - name: Wait for the stack to be ready
        run: |
          echo "waiting for the API container to report healthy..."
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' wrapsec_api 2>/dev/null || echo starting)
            [ "$status" = "healthy" ] && break
            sleep 5
          done
          echo "waiting for the dashboard to serve /login..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/login >/dev/null && break
            sleep 3
          done
          # Fail the step (and surface logs) if either is still not up.
          test "$(docker inspect --format '{{.State.Health.Status}}' wrapsec_api)" = "healthy"
          curl -sf http://localhost:3000/login >/dev/null

      - name: Seed E2E users (e2e-admin, e2e-viewer)
        run: docker exec wrapsec_api python scripts/seed_e2e_user.py

      - name: Install Playwright + Chromium
        working-directory: dashboard
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E (dedicated CI config)
        working-directory: dashboard
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npx playwright test --config playwright.ci.config.ts

      - name: Upload E2E failure artifacts (report + traces/screenshots/video)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-artifacts
          path: |
            dashboard/playwright-report/
            dashboard/test-results/
          retention-days: 7

      - name: Capture stack logs on failure
        if: failure()
        run: docker compose -f infrastructure/docker/docker-compose.yml logs --no-color > compose-logs.txt || true

      - name: Upload stack logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-compose-logs
          path: compose-logs.txt
          retention-days: 7

      - name: Tear down the stack
        if: always()
        run: docker compose -f infrastructure/docker/docker-compose.yml down -v || true
