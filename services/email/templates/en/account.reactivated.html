<!-- Informational security notification. Inline styles only (no style block)
     so placeholder tokens never collide with CSS braces. No links. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5;padding:24px 0;font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background-color:#ffffff;border:1px solid #e4e4e7;border-radius:8px;overflow:hidden;">
        <tr>
          <td style="background-color:#18181b;padding:20px 32px;color:#ffffff;font-size:18px;font-weight:bold;">WrapSec Security</td>
        </tr>
        <tr>
          <td style="padding:32px;color:#27272a;font-size:15px;line-height:1.6;">
            <p style="margin:0 0 16px;">Hi {display_name},</p>
            <p style="margin:0 0 16px;">Your WrapSec account was reactivated on <strong>{event_time} (UTC)</strong>. You can sign in again.</p>
            <p style="margin:0 0 16px;">If you were <strong>not</strong> expecting this, contact your WrapSec administrator.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 32px;background-color:#fafafa;border-top:1px solid #e4e4e7;color:#71717a;font-size:12px;line-height:1.5;">This is an automated security notification from WrapSec. Please do not reply to this message.</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
