[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wrapsec-refplugin"
version = "0.1.0"
description = "WrapSec reference plugin -- exercises every open-core seam (a permanent test instrument, not a product)"
requires-python = ">=3.10"
# Pinned to a core version range once the core is packaged; developed in-repo
# for now and imported directly in the seam-validation tests.
dependencies = ["wrapsec"]

[project.entry-points."wrapsec.plugins"]
refplugin = "wrapsec_refplugin:register"

[tool.setuptools]
packages = ["wrapsec_refplugin"]
